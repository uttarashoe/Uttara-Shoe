<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123a32"><title>উত্তরা সুজ | ব্যবস্থাপনা</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap');
:root{--green:#174b3f;--deep:#123a32;--gold:#dda94b;--bg:#f3f6f4;--ink:#192b26;--muted:#718079;--line:#e4ebe6;--white:#fff;--red:#b64e41}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Bengali',system-ui,sans-serif;font-size:14px}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh}.top{height:68px;background:var(--deep);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:4}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:18px}.logo{width:38px;height:38px;border-radius:12px;background:var(--gold);color:var(--deep);display:grid;place-items:center;font-weight:900}.brand-mark{width:88px;height:56px;object-fit:contain;background:#fff;border-radius:8px;padding:2px;flex:none}.userbox{display:flex;align-items:center;gap:10px;color:#e8f0ed}.userbox select{color:white;background:#ffffff19;border:1px solid #ffffff38;border-radius:9px;padding:8px}.layout{display:grid;grid-template-columns:220px 1fr;max-width:1500px;margin:auto}.side{padding:22px 14px;border-right:1px solid var(--line);min-height:calc(100vh - 68px);background:#f8faf8}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;text-align:left;padding:11px 13px;color:#52645c;border-radius:9px}.nav button.active,.nav button:hover{background:#e5eee9;color:var(--deep);font-weight:700}.nav .group{font-size:11px;color:#95a199;padding:18px 13px 5px}.side-note{margin:30px 8px;padding:13px;background:#edf3ef;border-radius:12px;color:#53675e;font-size:12px;line-height:1.7}.content{padding:26px 30px 50px;min-width:0}.page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:21px}.page-head h1{margin:0;font-size:23px}.page-head p{margin:5px 0;color:var(--muted)}.btn{border:0;background:var(--green);color:white;padding:10px 16px;border-radius:9px;font-weight:700}.btn.secondary{background:#e9f0ec;color:var(--deep)}.btn.gold{background:var(--gold);color:#26372f}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.card,.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:17px}.metric{font-size:12px;color:var(--muted)}.value{font-size:24px;font-weight:800;margin:8px 0 3px}.small{font-size:12px;color:var(--muted)}.columns{display:grid;grid-template-columns:1.2fr .8fr;gap:15px}.panel h2{font-size:16px;margin:0 0 14px}.row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.progress{height:7px;background:#edf1ee;border-radius:9px;overflow:hidden;width:35%}.progress i{display:block;background:var(--gold);height:100%}.toolbar{display:flex;gap:9px;align-items:center;margin-bottom:13px;flex-wrap:wrap}.toolbar input{flex:1;min-width:180px}.field, input,select{border:1px solid #dce5df;background:white;border-radius:8px;padding:9px 11px;color:var(--ink)}.tablewrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--muted);font-weight:600;background:#fafcfb}tr:last-child td{border:0}.badge{background:#e6f1e9;color:#276348;padding:4px 9px;border-radius:20px;font-size:11px}.badge.warn{background:#fff2dc;color:#9b6817}.badge.red{background:#fce9e6;color:#a3463a}.empty{padding:32px;text-align:center;color:var(--muted)}.stage{display:flex;gap:5px;align-items:center}.stage button{border:1px solid var(--line);background:white;color:#63736c;border-radius:6px;padding:5px 8px}.stage button.done{background:#e5f1e9;color:#276348;border-color:#cce2d3}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.formgrid label{display:grid;gap:5px;color:#596a62;font-size:12px}.formgrid input,.formgrid select{width:100%}.formgrid .wide{grid-column:1/-1}.overlay{position:fixed;inset:0;background:#10251fb0;z-index:8;display:grid;place-items:center;padding:16px}.modal{background:white;border-radius:15px;padding:22px;width:min(580px,100%);max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modalhead h2{margin:0}.close{border:0;background:#edf2ef;border-radius:50%;width:32px;height:32px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.hidden{display:none!important}.notice{background:#fff7e8;border:1px solid #f2dfb8;border-radius:10px;padding:11px 14px;color:#73551e;margin-bottom:14px;font-size:12px}.toast{position:fixed;bottom:20px;right:20px;background:#143e34;color:white;padding:12px 18px;border-radius:9px;z-index:12;box-shadow:0 4px 18px #0002}.muted{color:var(--muted)}.subnav{display:flex;gap:8px;margin-bottom:14px}.subnav button{background:#fff;border:1px solid var(--line);border-radius:20px;padding:7px 13px;color:#50635a}.subnav button.active{background:var(--deep);color:white}.reportgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.lineitem{display:grid;grid-template-columns:1fr 78px 105px 32px;gap:7px;margin:8px 0}.lineitem select,.lineitem input{min-width:0;width:100%}.del{border:0;background:#fce9e6;color:var(--red);border-radius:7px}.danger{color:var(--red)}
@media(max-width:850px){.layout{grid-template-columns:1fr}.side{min-height:0;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line);overflow:auto}.nav{display:flex;min-width:max-content}.nav .group,.side-note{display:none}.nav button{padding:8px 11px}.content{padding:20px 15px}.cards{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}.top{padding:0 14px}.brand{font-size:16px}.brand-mark{width:76px;height:48px}.userbox label{display:none}}@media(max-width:520px){.cards{gap:8px}.card{padding:13px}.value{font-size:20px}.page-head h1{font-size:20px}.page-head{gap:8px}.reportgrid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.formgrid .wide{grid-column:auto}.content{padding:16px 11px}.userbox select{max-width:120px}.lineitem{grid-template-columns:1fr 58px 83px 30px}}

<script>
const KEY='uttaraShoes.v1';const defaults={users:['ব্যবস্থাপনা পরিচালক','উৎপাদন দায়িত্বে','বিক্রয় দায়িত্বে','হিসাব দায়িত্বে'],access:{},accessRequests:[],materials:[],products:[],dealers:[],batches:[],sales:[],expenses:[],activityLogs:[],supplierPurchases:[],purchaseOrders:[],employees:[],employeePayments:[],attendance:[],staffTargets:[],workTasks:[],materialUsages:[]};let db=load();let currentUser='';let page='home';let salesFilter='সব',logFilter='সব',targetMonth=date().slice(0,7),attendanceViewDate=date(),usageMonth=date().slice(0,7);function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||'{}');let d={...defaults,...x,activityLogs:x.activityLogs||[],supplierPurchases:x.supplierPurchases||[],purchaseOrders:x.purchaseOrders||[],employees:x.employees||[],employeePayments:x.employeePayments||[],attendance:x.attendance||[],staffTargets:x.staffTargets||[],workTasks:x.workTasks||[],materialUsages:x.materialUsages||[],access:x.access||{},accessRequests:x.accessRequests||[]};d.dealers=d.dealers.map(v=>({...v,owner:v.owner||'ব্যবস্থাপক',type:v.type||'ডিলার',previousDue:Number(v.previousDue)||0}));d.products=d.products.map(p=>({...p,dealerPrice:Number(p.dealerPrice??p.price)||0,wholesalePrice:Number(p.wholesalePrice??p.price)||0,retailPrice:Number(p.retailPrice??p.price)||0}));return d}catch{return structuredClone(defaults)}}function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function logActivity(action,details=''){db.activityLogs.push({id:id(),user:user(),action,details,time:new Date().toISOString()})}function bn(n){return Number(n||0).toLocaleString('bn-BD')}function money(n){return '৳ '+bn(n)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function id(){return 'U'+Date.now().toString().slice(-8)}function date(){return new Date().toISOString().slice(0,10)}function fmtDate(d){return d?new Date(d+'T00:00:00').toLocaleDateString('bn-BD'):'—'}function toast(s){let t=document function openMaterialUsage(){if(!db.materials.length){toast('আগে কাঁচামাল যোগ করুন');return}modal('কাঁচামাল ব্যবহার নথিভুক্ত',`<div class="formgrid"><label>তারিখ<input id="usageDate" type="date" value="${date()}" required></label><label>উৎপাদন অর্ডার<select id="usageBatch"><option value="">সাধারণ ব্যবহার</option>${db.batches.map(b=>`<option value="${esc(b.id)}">${esc(b.model)} · ${esc(b.color)} · ${fmtDate(b.date)}</option>`).join('')}</select></label></div><p class="small">একক খরচ বর্তমান কাঁচামাল দর থেকে আসবে; প্রয়োজন হলে পরিবর্তন করুন। ব্যবহার সংরক্ষণ করলে মজুত থেকে পরিমাণ কমবে।</p><div id="usageLines">${materialUsageLine()}</div><button type="button" class="btn secondary" onclick="addMaterialUsageLine()">＋ কাঁচামাল যোগ</button><div class="row"><b>মোট কাঁচামাল খরচ</b><b id="usageTotal">৳ ০</b></div>`,`saveMaterialUsage()`)}function materialUsageLine(){let opts=db.materials.map(m=>`<option value="${esc(m.id)}" data-cost="${Number(m.cost)||0}">${esc(m.name)} · মজুত ${bn(m.qty)} ${esc(m.unit||'একক')}</option>`).join('');return `<div class="lineitem usageline"><select class="usagematerial" onchange="usageMaterialChanged(this);calcUsageTotal()" required><option value="">কাঁচামাল নির্বাচন</option>${opts}</select><input class="usageqty" type="number" min="0.001" step="0.001" placeholder="পরিমাণ" oninput="calcUsageTotal()" required><input class="usagecost" type="number" min="0" step="0.01" placeholder="একক খরচ" oninput="calcUsageTotal()" required><button type="button" class="del" onclick="this.parentElement.remove();calcUsageTotal()">×</button></div>`}function addMaterialUsageLine(){document.querySelector('#usageLines').insertAdjacentHTML('beforeend',materialUsageLine())}function usageMaterialChanged(sel){let opt=sel.selectedOptions[0],row=sel.closest('.usageline');row.querySelector('.usagecost').value=opt.dataset.cost||0}function calcUsageTotal(){let total=[...document.querySelectorAll('.usageline')].reduce((a,r)=>a+(Number(r.querySelector('.usageqty').value)||0)*(Numbe function openStaffTarget(){if(!requireManagerAction())return;let people=db.users.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');modal('কর্মীর মাসিক লক্ষ্যমাত্রা',`<div class="formgrid"><label>কর্মকর্তা / কর্মচারী<select id="targetPerson" required>${people}</select></label><label>লক্ষ্যের ধরন<select id="targetMetric"><option value="sales">বিক্রয় মূল্য (টাকা)</option><option value="production">উৎপাদন (জোড়া)</option></select></label><label>মাস<input id="targetMonthInput" type="month" value="${targetMonth}" required></label><label>লক্ষ্য<input id="targetValue" type="number" min="1" required></label></div>`,`saveStaffTarget()`)}function saveStaffTarget(){if(!requireManagerAction())return;let person=val('targetPerson'),metric=val('targetMetric'),month=val('targetMonthInput'),target=num('targetValue');if(!person||!month||target<=0)return toast('নাম, মাস ও লক্ষ্য ঠিকভাবে দিন');let t=db.staffTargets.find(x=>x.person===person&&x.metric===metric&&x.month===month);if(t)t.target=target;else db.staffTargets.push({id:id(),person,metric,month,target});logActivity('কর্মী লক্ষ্যমাত্রা নির্ধারণ',person+' · '+month+' · '+(metric==='sales'?'বিক্রয়':'উৎপাদন')+' · '+target);closeModal();save();toast('লক্ষ্যমাত্রা সংরক্ষিত')}

function supplierDuePage(el){let mine=db.supplierPurchases.filter(p=>p.owner===user()),groups={};mine.forEach(p=>{groups[p.supplier]=groups[p.supplier]||{total:0,paid:0,due:0,count:0};groups[p.supplier].total+=p.total;groups[p.supplier].paid+=p.paid;groups[p.supplier].due+=p.due;groups[p.supplier].count++});let summary=Object.entries(groups).map(([name,x])=>`<tr><td><b>${esc(name)}</b></td><td>${bn(x.count)}টি</td><td>${money(x.total)}</td><td>${money(x.paid)}</td><td class="danger"><b>${money(x.due)}</b></td></tr>`).join('');let rows=mine.slice().reverse().map(p=>`<tr><td>${fmtDate(p.date)}</td><td>${esc(p.supplier)}</td><td>${esc(p.material)}</td><td>${bn(p.qty)} ${esc(p.unit)}</td><td>${money(p.total)}</td><td>${money(p.paid)}</td><td>${esc(paymentMethods(p.payments,p.paymentMethod))}</td><td>${money(p.due)}</td><td>${p.due?`<button class="btn secondary" onclick="paySupplier('${p.id}')">বাকি জমা</button>`:'<span class="badge">পরিশোধিত</span>'}</td></tr>`).join('');el.innerHTML=title('সরবরাহকারী বাকি','আপনার কেনাকাটা ও সরবরাহকারীর কাছে বকেয়া',`<button class="btn secondary" onclick="window.print()">প্রিন্ট / PDF</button>`)+`<h2>সরবরাহকারীভিত্তিক সারাংশ</h2>`+table(['সরবরাহকারী','কেনাকাটা','মোট','পরিশোধ','বাকি'],summary,'এখনও কোনো সরবরাহকারী কেনাকাটা নেই')+`<h2 style="margin-top:20px">কেনাকাটার হিসাব</h2>`+table(['তারিখ','সরবরাহকারী','কাঁচামাল','পরিমাণ','মোট','পরিশোধ','পরিশোধের মাধ্যম','বাকি','কাজ'],rows,'এখনও কোনো কেনাকাটা নেই')}function paySupplier(pid){let p=db.supplierPurchases.find(x=>x.id===pid);if(!p||p.due<=0)return;modal('সরবরাহকারীকে পরিশোধ',`<p>${esc(p.supplier)} · বাকি ${money(p.due)}</p><div class="formgrid"><label>পরিশোধের পরিমাণ<input id="supplierPayAmount" type="number" min="0.01" step="0.01" max="${p.due}" required></label><label>লেনদেনের মাধ্যম<select id="supplierPayMethod">${paymentMethodOptions()}</select></label><label class="wide">ট্রানজ্যাকশন / রেফারেন্স নম্বর (ঐচ্ছিক)<input id="supplierPayRef"></label></div>`,`saveSupplierPayment('${pid}')`)}function saveSupplierPayment(pid){let p=db.supplierPurchases.find(x=>x.id===pid),amount=num('supplierPayAmount'),method=val('supplierPayMethod');if(!p||amount<=0||amount>p.due){toast('টাকার পরিমাণ যাচাই করুন');return}p.paid+=amount;p.due-=amount;p.payments=p.payments||[];p.payments.push({id:id(),date:date(),amount,method,reference:val('supplierPayRef'),by:user()});logActivity('সরবরাহকারীকে পেমেন্ট',p.supplier+' · '+money(amount)+' · '+method);closeModal();save();toast('পরিশোধ ও মাধ্যম নথিভুক্ত হয়েছে')}async function pinHash(pin){let bytes=new TextEncoder().encode(pin);let digest=await crypto.subtle.digest('SHA-256',bytes);return [...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,'0')).join('')}function showAuth(){let root=document.querySelector('#modalroot');let director='ব্যবস্থাপনা পরিচালক';if(!db.access[director]?.pinHash){root.innerHTML=`<div class="overlay"><form class="modal" onsubmit="bootstrapDirector();return false"><div class="modalhead"><h2>ব্যবস্থাপনা পরিচালক সেটআপ</h2></div><p>প্রথমে পরিচালক অ্যাকাউন্টের PIN তৈরি করুন। এরপর পরিচালক অন্য ব্যবহারকারীদের অনুমোদন দিতে পারবেন।</p><label>নতুন PIN (কমপক্ষে ৬ অঙ্ক)<input id="directorPin" type="password" inputmode="numeric" minlength="6" required></label><div class="actions"><button class="btn">পরিচালক অ্যাকাউন্ট তৈরি</button></div></form></div>`;return}let active=db.users.filter(n=>db.access[n]?.approved);root.innerHTML=`<div class="overlay"><form class="modal" onsubmit="loginUser();return false"><div class="modalhead"><h2>ব্যবহারকারী লগইন</h2></div><p>অ্যাপ ব্যবহারের জন্য পরিচালকের অনুমোদিত অ্যাকাউন্ট প্রয়োজন।</p><label>ব্যবহারকারী<select id="loginName" required>${active.map(n=>`<option>${esc(n)}</option>`).join('')}</select></label><label style="display:block;margin-top:12px">PIN<input id="loginPin" type="password" inputmode="numeric" required></label><div class="actions"><button type="button" class="btn secondary" onclick="requestAccess()">ব্যবহারের অনুমতি চান</button><button class="btn">লগইন</button></div></form></div>`}async function bootstrapDirector(){let pin=document.querySelector('#directorPin').value;if(pin.length<6)return;db.access['ব্যবস্থাপনা পরিচালক']={pinHash:await pinHash(pin),approved:true,manager:true};if(!db.users.includes('ব্যবস্থাপনা পরিচালক'))db.users.unshift('ব্যবস্থাপনা পরিচালক');save();currentUser='ব্যবস্থাপনা পরিচালক';document.querySelector("#printBrandImg").src=document.querySelector(".brand-mark").src;showAuth();toast('পরিচালক PIN তৈরি হয়েছে; লগইন করুন')}async function loginUser(){let name=document.querySelector('#loginName').value,pin=document.querySelector('#loginPin').value,a=db.access[name];if(!a?.approved||a.pinHash!==await pinHash(pin)){toast('ব্যবহারকারী বা PIN সঠিক নয়');return}currentUser=name;let pages=allowedPages(name);page=pages[0]||'noAccess';logActivity('লগইন','অনুমোদিত সেশন শুরু');localStorage.setItem(KEY,JSON.stringify(db));document.querySelector('#modalroot').innerHTML='';render()}function logout(){if(currentUser){logActivity('লগআউট','সেশন শেষ');localStorage.setItem(KEY,JSON.stringify(db))}currentUser='';page='home';showAuth()}function requestAccess(){let name=prompt('আপনার পূর্ণ নাম লিখুন; পরিচালক অনুমোদন করলে অ্যাকাউন্ট চালু হবে:');if(!name?.trim())return;name=name.trim();if(db.access[name]?.approved){toast('এই নামে অ্যাকাউন্ট আগে থেকেই আছে');return}if(!db.accessRequests.includes(name))db.accessRequests.push(name);save();document.querySelector("#printBrandImg").src=document.querySelector(".brand-mark").src;showAuth();toast('অনুমতির অনুরোধ পরিচালকের কাছে সংরক্ষিত হয়েছে')}function permissionOptions(name,selected=[]){return Object.entries(pageNames()).map(([key,label])=>`<label style="display:inline-flex;align-items:center;gap:5px;margin:4px 10px 4px 0"><input class="permission-choice" type="checkbox" name="${esc(name)}" value="${key}" ${selected.includes(key)?'checked':''}>${label}</label>`).join('')}function userAdminPage(el){if(!db.access[user()]?.manager){el.innerHTML=title('ব্যবহারকারী অনুমোদন','এই পৃষ্ঠা শুধু ব্য .map(x=>pageNames()[x]).join(', '));save();toast('ব্যবহারকারী ও নির্ধারিত অপশন অনুমোদিত হয়েছে')}function rejectUser(index){let name=db.accessRequests[index];if(!name)return;db.accessRequests=db.accessRequests.filter(x=>x!==name);save();toast('অনুমতির অনুরোধ বাতিল হয়েছে')}let editingAccessIndex=-1;function editUserPermissions(index){let name=db.users[index],a=db.access[name];if(!a?.approved||a.manager)return;editingAccessIndex=index;modal('ব্যবহারকারীর অনুমতি নির্ধারণ',`<p>${esc(name)} কোন কোন অপশন ব্যবহার করতে পারবেন বেছে নিন।</p><div>${permissionOptions('editperm',a.permissions||[])}</div>`,`saveUserPermissions()`)}function saveUserPermissions(){if(!db.access[user()]?.manager||editingAccessIndex<0)return;let name=db.users[editingAccessIndex],permissions=[...document.querySelectorAll('input[name="editperm"]:checked')].map(x=>x.value);if(!permissions.length){toast('কমপক্ষে একটি অপশন দিন; সব বন্ধ করতে “সব অনুমতি বন্ধ” ব্যবহার করুন');return}db.access[name].permissions=permissions;logActivity('ব্যবহারকারীর অ্যাক্সেস পরিবর্তন',name+' · '+permissions.map(x=>pageNames()[x]).join(', '));editingAccessIndex=-1;closeModal();save();toast('ব্যবহারকারীর অনুমতি হালনাগাদ হয়েছে')}function revokeUserAccess(index){let name=db.users[index],a=db.access[name];if(!a?.approved||a.manager||!confirm(name+'-এর সব অপশন অ্যাক্সেস বন্ধ করবেন?'))return;a.permissions=[];logActivity('ব্যবহারকারীর সব অনুমতি বন্ধ',name);save();toast('ব্যবহারকারীর অ্যাক্সেস বন্ধ হয়েছে')}function purchaseOrdersPage(el){let mine=db.purchaseOrders.filter(p=>isManager()||p.by===user()).slice().reverse(),rows=mine.map(p=>`<tr><td><b>${esc(p.no)}</b></td><td>${fmtDate(p.date)}</td><td>${esc(p.supplier)}</td><td>${money(p.total)}</td><td><span class="badge ${p.status==='অর্ডার করা'?'warn':''}">${esc(p.status)}</span></td><td><button class="btn secondary" onclick="printPurchaseOrder('${p.id}')">প্রিন্ট</button> ${p.status==='অর্ডার করা'?`<button class="btn" onclick="receivePurchaseOrder('${p.id}')">মাল গ্রহণ</button>`:''} ${i function openBatch(){modal('নতুন উৎপাদন অর্ডার',`<div class="formgrid"><label>মডেল<input id="bmodel" required placeholder="যেমন: US-101"></label><label>রং<input id="bcolor" required></label><label class="wide">সাইজসমূহ<input id="bsizes" required placeholder="যেমন: ৩৯, ৪০, ৪১, ৪২"></label><label>লক্ষ্যমাত্রা (জোড়া)<input id="btarget" type="number" min="1" required oninput="planCalc()"></label><label>প্রাথমিক বিক্রয় মূল্য<input id="bprice" type="number" min="0"></label><label>শুরুর তারিখ<input id="bdate" type="date" value="${date()}"></label><label class="wide">শ্রম ও অন্যান্য উৎপাদন খরচ (টাকা)<input id="bothercost" type="number" min="0" value="0" oninput="planCalc()"></label></div><section class="panel" style="margin-top:14px"><h2>কাঁচামাল ও আনুমানিক উৎপাদন খরচ</h2><p class="small">প্রতি জোড়ায় যতটুকু কাঁচামাল লাগবে লিখুন। কাঁচামালের হিসাব বর্তমান একক দরে হবে। শ্রম ও অন্যান্য খরচ আলাদা লিখুন।</p><div id="planLines">${materialPlanLine()}</div><button type="button" class="btn secondary" onclick="addMaterialPlanLine()">＋ কাঁচামাল যোগ</button><div class="row"><span>আনুমানিক প্রতি জোড়ার মোট খরচ</span><b id="planUnitCost">৳ ০</b></div><div class="row"><span>পুরো অর্ডারের আনুমানিক খরচ</span><b id="planBatchCost">৳ ০</b></div></section>`,`saveBatch()`)}function materialPlanLine(){let options=db.materials.map(m=>`<option value="${esc(m.id)}" data-cost="${Number(m.cost)||0}" data-unit="${esc(m.unit||'একক')}">${esc(m.name)} · ${money(m.cost||0)}/${esc(m.unit||'একক')}</option>`).join('');return `<div class="lineitem planline"><select class="planmaterial" onchange="planCalc()"><option value="">কাঁচামাল নির্বাচন</option>${options}</select><input class="planqty" type="number" min="0" step="0.001" placeholder="প্রতি জোড়ায় পরিমাণ" oninput="planCalc()"><button type="button" class="del" onclick="this.parentElement.remove();planCalc()">×</button></div>`}function addMaterialPlanLine(){document.querySelector('#planLines').insertAdjacentHTML('beforeend',materialPlanLine())}function planCalc(){let materialUnit=[...document.querySelectorAll('.planline')].reduce((a,r)=>{let opt=r.querySelector('.planmaterial').selectedOptions[0];return a+(Number(r.querySelector('.planqty').value)||0)*(Number(opt?.dataset.cost)||0)},0),target=Number(document.querySelector('#btarget')?.value)||0,other=Number(document.querySelector('#bothercost')?.value)||0,unit=materialUnit+(target?other/target:0),total=materialUnit*target+other;let u=document.querySelector('#planUnitCost'),t=document.querySelector('#planBatchCost');if(u)u.textContent=money(unit);if(t)t.textContent=money(total)}function saveBatch(){let plannedMaterials=[...document.querySelectorAll('.planline')].map(r=>{let m=db.materials.find(x=>x.id===r.querySelector('.planmaterial').value);return m?{materialId:m.id,name:m.name,unit:m.unit,perPair:Number(r.querySelector('.planqty').value)||0,unitCost:m.cost||0}:null}).filter(x=>x&&x.perPair>0);let materialUnitCost=plannedMaterials.reduce((a,x)=>a+x.perPair*x.unitCost,0),target=num('btarget'),otherCost=num('bothercost'),unitCost=materialUnitCost+(target?otherCost/target:0);db.batches.push({id:id(),model:val('bmodel'),color:val('bcolor'),sizes:val('bsizes'),target,price:num('bprice'),date:val('bdate')||date(),stage:0,good:target,reject:0,plannedMaterials,materialUnitCost,unitCost,otherCost,batchCost:materialUnitCost*target+otherCost,by:user()});logActivity('উৎপাদন অর্ডার তৈরি',val('bmodel')+' · '+val('bcolor')+' · আনুমানিক খরচ/জোড়া '+money(unitCost));closeModal();save();toast('উৎপাদন অর্ডার ও খরচের পরিকল্পনা সংরক্ষিত হয়েছে')}function openProduct(){modal('তৈরি পণ্য যোগ',`<div class="formgrid"><label>মডেল<input id="pmodel" required></label><label>রং<input id="pcolor"></label><label class="wide">সাইজ<input id="psizes" placeholder="যেমন: ৩৯, ৪০, ৪১"></label><label>মজুত (জোড়া)<input id="pqty" type="number" min="0" value="0"></label><label>উৎপাদন খরচ / জোড়া<input id="pcost" type="number" min="0" placeholder="অজানা হলে খালি রাখুন"></label><label>ডিলার মূল্য (জোড়া)<input id="pdealer" type="number" min="0" value="0"></label><label>পাইকারী মূল্য (জোড়া)<input id="pwholesale" type="number" min="0" value="0"></label><label>খুচরা মূল্য (জোড়া)<input id="pretail" type="number" min="0" value="0"></label></div>`,`saveProduct()`)}function saveProduct(){let enteredCost=val('pcost'),unitCost=enteredCost===''?null:num('pcost'),o={id:id(),model:val('pmodel'),color:val('pcolor'),sizes:val('psizes'),qty:num('pqty'),unitCost,dealerPrice:num('pdealer'),wholesalePrice:num('pwholesale'),retailPrice:num('pretail'),price:num('pretail')};let p=db.products.find(x=>x.model===o.model&&x.color===o.color&&x.sizes===o.sizes);if(p&&!requireManagerAction())return;if(p){let oldQty=Number(p.qty)||0;if(oldQty===0&&o.unitCost!==null)p.unitCost=o.unitCost;else if(o.unitCost!==null&&p.unitCost!=null&&Number.isFinite(Number(p.unitCost)))p.unitCost=(Number(p.unitCost)*oldQty+o.unitCost*o.qty)/(oldQty+o.qty);else if(o.qty>0)p.unitCost=null;p.qty+=o.qty;p.dealerPrice=o.dealerPrice;p.wholesalePrice=o.wholesalePrice;p.retailPrice=o.retailPrice;p.price=o.retailPrice}else db.products.push(o);logActivity('তৈরি পণ্যের মজুত যোগ',o.model+' · '+o.qty+' জোড়া');closeModal();save();toast('তৈরি পণ্যের মজুত যোগ হয়েছে')}function adjustProduct(pid){if(!requireManagerAction())return;let p=db.products.find(x=>x.id===pid);modal('পণ্যের মজুত সমন্বয়',`<p>${esc(p.model)} · ${esc(p.color)} · ${esc(p.sizes)}</p><label>নতুন মজুত (জোড়া)<input id="newqty" type="number" min="0" value="${p.qty}"></label>`,`db.products.find(x=>x.id==='${pid}').qty=num('newqty');logActivity('পণ্যের মজুত সমন্বয়',p.model+' · '+num('newqty')+' জোড়া');closeModal();save()`)}
function openDealer(){modal('নতুন ডিলার',`<div class="formgrid"><label>ডিলার / প্রতিষ্ঠানের নাম<input id="dname" required></label><label>ধরন<select id="dtype"><option>ডিলার</option><option>পাইকার</option></select></label><label>ফোন<input id="dphone" type="tel"></label><label class="wide">ঠিকানা<input id="daddress"></label>${isManager()?`<label class="wide">আগের বাকি (টাকা)<input id="dprevious" type="number" min="0" value="0"></label>`:''}</div>`,`saveDealer()`)}function saveDealer(){let previousDue=isManager()?num('dprevious'):0;db.dealers.push({id:id(),name:val('dname'),phone:val('dphone'),address:val('daddress'),type:val('dtype')||'ডিলার',owner:user(),previousDue});if(previousDue)logActivity('আগের বাকি সংযোজন',val('dname')+' · '+money(previousDue));logActivity('ডিলার যোগ',val('dname'));closeModal();save();toast('ডিলারের তথ্য সংরক্ষিত')}function adjustPreviousDue(dealerId){if(!requireManagerAction())return;let d=db.dealers.find(x=>x.id===dealerId);if(!d)return;modal('আগের বাকি সংযোজন / বিয়োজন',`<p><b>${esc(d.name)}</b> · বর্তমান আগের বাকি ${money(d.previousDue||0)}</p><div class="formgrid"><label>কাজ<select id="pdaction"><option value="add">বাকি সংযোজন</option><option value="subtract">বাকি বিয়োজন</option></select></label><label>টাকার পরিমাণ<input id="pdamount" type="number" min="0.01" step="0.01" required></label><label class="wide">কারণ<input id="pdnote" required></label></div>`,`savePreviousDue('${dealerId}')`)}function savePreviousDue(dealerId){if(!requireManagerAction())return;let d=db.dealers.find(x=>x.id===dealerId),amount=num('pdamount'),action=val('pdaction');if(!d||amount<=0)return toast('টাকার পরিমাণ দিন');if(action==='subtract'&&amount>(Number(d.previousDue)||0))return toast('আগের বাকি থেকে বেশি বিয়োজন করা যাবে না');let change=action==='add'?amount:-amount;d.previousDue=(Number(d.previousDue)||0)+change;logActivity(action==='add'?'আগের বাকি সংযোজন':'আগের বাকি বিয়োজন',d.name+' · '+money(amount)+' · '+val('pdnote'));closeModal();save();toast('আগের বাকি হালনাগাদ হয়েছে')}function openSale(dealerId=''){if(!canAccess('sales')){toast('বিক্রি অপশন ব্যবহারের অনুমতি নেই');return}let dealers=db.dealers.filter(d=>(d.owner||'ব্যবস্থাপক')===user()).map(d=>`<option value="${esc(d.name)}" ${d.id===dealerId?'selected':''}>${esc(d.name)}</option>`).join('');modal('নতুন বিক্রি',`<div class="formgrid"><label>বিক্রির ধরন<select id="skind" onchange="toggleCustomer()"><option>ডিলার</option><option>নিজস্ব দোকান</option></select></label><label>তারিখ<input id="sdate" type="date" value="${date()}"></label><label class="wide" id="customerwrap">ডিলার নির্বাচন<select id="scustomer" onchange="syncSalePrices()"><option value="">নতুন / অন্যান্য ক্রেতা</option>${dealers}</select></label><label class="wide hidden" id="shopwrap">ক্রেতা / কাউন্টার নাম<input id="shopcustomer" value="দোকান বিক্রি"></label></div><div style="margin-top:16px;font-weight:700">পণ্য যোগ করুন</div><div id="saleitems">${saleItem()}</div><button type="button" class="btn secondary" onclick="addSaleItem()">＋ আরেকটি পণ্য</button><div class="formgrid" style="margin-top:14px"><label>ছাড় (টাকা)<input id="sdiscount" type="number" min="0" value="0" oninput="calcTotal()"></label><label>জমা (টাকা)<input id="spaid" type="number" min="0" value="0" oninput="calcTotal()"></label><label>জমার মাধ্যম<select id="spaymethod">${paymentMethodOptions()}</select></label><label>ট্রানজ্যাকশন / রেফারেন্স নম্বর (ঐচ্ছিক)<input id="spayref"></label></div><div class="row"><b>মোট</b><b id="saletotal">৳ ০</b></div>`,`saveSale()`)}function saleItem(){let opts=db.products.map(p=>`<option value="${p.id}" data-dealer="${p.dealerPrice??p.price}" data-wholesale="${p.wholesalePrice??p.price}" data-retail="${p.retailPrice??p.price}" data-qty="${p.qty}">${esc(p.model)} · ${esc(p.color)} · ${esc(p.sizes)} (মজুত ${bn(p.qty)})</option>`).join('');return `<div class="lineitem"><select class="itemproduct" onchange="itemChanged(this);calcTotal()" required><option value="">পণ্য নির্বাচন</option>${opts}</select><input class="itemqty" type="number" min="1" placeholder="জোড়া" value="1" oninput="calcTotal()"><input class="itemprice" type="number" min="0" placeholder="দাম" oninput="calcTotal()"><button type="button" class="del" onclick="this.parentElement.remove();calcTotal()">×</button></div>`}function addSaleItem(){document.querySelector('#saleitems').insertAdjacentHTML('beforeend',saleItem())}function selectedSalePrice(opt){if(document.querySelector('#skind').value==='নিজস্ব দোকান')return opt.dataset.retail||0;let customer=document.querySelector('#scustomer').value,d=db.dealers.find(x=>x.name===customer&&(x.owner||'ব্যবস্থাপক')===user());return d?.type==='পাইকার'?(opt.dataset.wholesale||opt.dataset.dealer||0):(opt.dataset.dealer||0)}function itemChanged(sel){let opt=sel.selectedOptions[0],row=sel.closest('.lineitem');row.querySelector('.itemprice').value=selectedSalePrice(opt);row.querySelector('.itemqty').max=opt.dataset.qty||0}function syncSalePrices(){document.querySelectorAll('.itemproduct').forEach(sel=>{if(sel.value)itemChanged(sel)});calcTotal()}function calcTotal(){let total=[...document.querySelectorAll('.lineitem')].reduce((a,r)=>a+(Number(r.querySelector('.itemqty').value)||0)*(Number(r.querySelector('.itemprice').value)||0),0)-Number(document.querySelector('#sdiscount')?.value||0);let t=document.querySelector('#saletotal');if(t)t.textContent=money(Math.max(0,total))}function toggleCustomer(){let shop=document.querySelector('#skind').value==='নিজস্ব দোকান';document.querySelector('#customerwrap').classList.toggle('hidden',shop);document.querySelector('#shopwrap').classList.toggle('hidden',!shop);syncSalePrices()}
function paymentMethodOptions(){return '<option>নগদ টাকা</option><option>ব্যাংক ট্রান্সফার</option><option>বিকাশ</option><option>রকেট</option><option>নগদ (মোবাইল)</option><option>কার্ড</option><option>অন্যান্য</option>'}function paymentMethods(records=[],fallback=''){let methods=[...new Set((records||[]).map(x=>x.method).filter(Boolean))];if(!methods.length&&fallback)methods=[fallback];return methods.join(' · ')||'—'}function saveSale(){let kind=document.querySelector('#skind').value,customer=kind==='নিজস্ব দোক'?val('shopcustomer'):(val('scustomer')||'অন্যান্য ক্রেতা');let lines=[...document.querySelectorAll('.lineitem')].map(r=>{let p=db.products.find(x=>x.id===r.querySelector('.itemproduct').value);return {pid:r.querySelector('.itemproduct').value,qty:Number(r.querySelector('.itemqty').value),price:Number(r.querySelector('.itemprice').value),unitCost:p?.unitCost??null}});if(!lines.length||lines.some(l=>!l.pid||l.qty<1)){toast('পণ্য ও পরিমাণ ঠিকভাবে দিন');return}for(let l of lines){let p=db.products.find(x=>x.id===l.pid);if(!p||p.qty<l.qty){toast('একটি পণ্যের মজুত পর্যাপ্ত নয়');return}}let subtotal=lines.reduce((a,l)=>a+l.qty*l.price,0),total=Math.max(0,subtotal-num('sdiscount')),paid=Math.min(total,num('spaid')),costKnown=lines.every(l=>Number.isFinite(l.unitCost)),costTotal=costKnown?lines.reduce((a,l)=>a+l.qty*l.unitCost,0):null,profit=costKnown?total-costTotal:null,method=val('spaymethod'),payments=paid?[{id:id(),date:val('sdate')||date(),amount:paid,method,reference:val('spayref')||'',by:user()}]:[];lines.forEach(l=>db.products.find(p=>p.id===l.pid).qty-=l.qty);let s={id:id(),no:'US-'+new Date().getFullYear()+'-'+String(db.sales.length+1).padStart(4,'0'),date:val('sdate')||date(),customer,kind,lines,subtotal,discount:num('sdiscount'),total,paid,due:total-paid,payments,paymentMethod:paid?method:"",costTotal,profit,by:user()};db.sales.push(s);logActivity('বিক্রির চালান তৈরি',s.no+' · '+customer+' · বিক্রয় '+money(total)+(paid?' · মাধ্যম '+method:'')+(costKnown?' · মুনাফা '+money(profit):' · উৎপাদন খরচ অনুপস্থিত'));closeModal();save();toast(costKnown?'বিক্রি ও মুনাফা হিসাব হয়েছে':'বিক্রি সংরক্ষিত; পণ্যের উৎপাদন খরচ যোগ করলে মুনাফা দেখা যাবে')}function receivePayment(sid){let s=db.sales.find(x=>x.id===sid);if(!s||s.due<=0)return;modal('বাকি জমা নথিভুক্ত',`<p>চালান ${esc(s.no)} · বাকি ${money(s.due)}</p><div class="formgrid"><label>জমার পরিমাণ<input id="receiveAmount" type="number" min="0.01" step="0.01" max="${s.due}" required></label><label>লেনদেনের মাধ্যম<select id="receiveMethod">${paymentMethodOptions()}</select></label><label class="wide">ট্রানজ্যাকশন / রেফারেন্স নম্বর (ঐচ্ছিক)<input id="receiveRef"></label></div>`,`saveReceivedPayment('${sid}')`)}function saveReceivedPayment(sid){let s=db.sales.find(x=>x.id===sid),amount=num('receiveAmount'),method=val('receiveMethod');if(!s||amount<=0||amount>s.due){toast('টাকার পরিমাণ যাচাই করুন');return}s.paid+=amount;s.due-=amount;s.payments=s.payments||[];s.payments.push({id:id(),date:date(),amount,method,reference:val('receiveRef'),by:user()});logActivity('পেমেন্ট গ্রহণ',s.no+' · '+money(amount)+' · '+method);closeModal();save();toast('পেমেন্ট ও মাধ্যম নথিভুক্ত হয়েছে')}function printSale(sid){let s=db.sales.find(x=>x.id===sid);let w=window.open('','_blank','width=750,height=700');if(!w){toast('রসিদ খুলতে ব্রাউজারের পপআপ অনুমতি দিন');return}w.document.write(`<html lang="bn"><meta charset="utf-8"><title>বিক্রয় ভাউচার ${esc(s.no)}</title><style>body{font-family:Arial,sans-serif;max-width:700px;margin:35px auto;color:#193b32}h1{text-align:center;margin:0}.brandhead{text-align:center}.brandlogo{display:block;width:100px;height:60px;object-fit:contain;margin:0 auto 6px}p{text-align:center}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{padding:10px;border:1px solid #ddd;text-align:left}.right{text-align:right}.sum{margin:20px 0 0 auto;width:270px;line-height:2}</style><div class="brandhead"><img class="brandlogo" src="${document.querySelector(".brand-mark").src}" alt="উত্তরা সুজ লোগো"><h1>উত্তরা সুজ</h1></div><p>বিক্রয় ভাউচার</p><hr><p style="text-align:left">চালান: ${esc(s.no)}　 তারিখ: ${fmtDate(s.date)}<br>ক্রেতা: ${esc(s.customer)}　 ধরন: ${esc(s.kind)}</p><table><tr><th>পণ্য</th><th>পরিমাণ</th><th>দর</th><th>মোট</th></tr>${s.lines.map(l=>{let p=db.products.find(x=>x.id===l.pid);return `<tr><td>${esc(p?.model||'পণ্য')} · ${esc(p?.color||'')} · ${esc(p?.sizes||'')}</td><td>${bn(l.qty)}</td><td>${money(l.price)}</td><td>${money(l.qty*l.price)}</td></tr>`}).join('')}</table><div class="sum">মূল্য: ${money(s.subtotal)}<br>ছাড়: ${money(s.discount)}<br><b>সর্বমোট: ${money(s.total)}</b><br>জমা: ${money(s.paid)}<br>জমার মাধ্যম: ${esc(paymentMethods(s.payments,s.paymentMethod))}<br><b>বাকি: ${money(s.due)}</b></div><p style="margin-top:55px">বিক্রেতা: ${esc(s.by)}　　ক্রেতার স্বাক্ষর: __________________</p><script>window.print()<\/script></html>`);w.document.close()}
